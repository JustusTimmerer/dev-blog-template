; Dedicated static-site/contact deployment. Do not reuse for a CMS.
; STRATO reads php.ini in the domain's web root (also with PHP Boost).
; Keep the runtime patched: these settings are defense in depth, not PHP2Shell fixes.
enable_post_data_reading = Off
file_uploads = Off
session.upload_progress.enabled = Off
session.auto_start = Off
variables_order = "S"
request_order = ""
register_argc_argv = Off
allow_url_fopen = Off
allow_url_include = Off
display_errors = Off
display_startup_errors = Off
expose_php = Off
post_max_size = 64K
max_input_vars = 8
max_input_nesting_level = 1
max_input_time = 5
max_execution_time = 10
memory_limit = 32M
