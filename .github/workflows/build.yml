name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/contact-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  contact-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/contact-handler.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, contact-security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - run: cd dist && zip -qr "../site-${GITHUB_REF_NAME}.zip" .
      - name: Attach site archive without changing an existing release's publication state
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "site-${GITHUB_REF_NAME}.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "site-${GITHUB_REF_NAME}.zip" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
